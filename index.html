<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sylva — AI Crop Disease &amp; Pest Detection</title>
    <meta name="description" content="AI crop disease and pest detection with actionable recommendations." />
    <meta property="og:title" content="Sylva — AI Crop Disease &amp; Pest Detection" />
    <meta property="og:description" content="AI crop disease and pest detection with actionable recommendations." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Suppress Vite dev HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var msg = String(event && (event.reason && (event.reason.stack || event.reason.message) || event.reason) || '');
        if (msg.includes('WebSocket') || msg.includes('createWebSocketModuleRunnerTransport') || msg.includes('@vite/client')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = String(event && (event.message || event.filename) || '');
        if (msg.includes('WebSocket') || msg.includes('createWebSocketModuleRunnerTransport') || msg.includes('@vite/client')) {
          event.preventDefault();
        }
      });
      // Zero-flash theme initialization for Eucalyptus Haze & Midnight Sylva
      (function() {
        try {
          var saved = localStorage.getItem('sylva_theme_v1');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-app text-primary antialiased selection:bg-highlight selection:text-primary min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
